<script>

const IS_PREVIEW = false; // Set default true untuk Canvas
const GAS_URL = "https://script.google.com/macros/s/AKfycbxAFzmJhC1c9PwaCranL9E27NlR6VbXYHA96stxBoiHHvR0DC8iDm9wOJQd1TPX8xA/exec";
const APP_NAME = "CBT Online";

/* ==================================================================
   DATA DUMMY + SERVER PALSU (hanya dipakai saat IS_PREVIEW = true)
   Logikanya meniru Code.gs agar perilaku preview sama dengan aslinya.
================================================================== */
const MOCK = (function () {
  const now = Date.now(), DAY = 86400000;
  const D = { users: [], ujian: [], soal: [], sesi: [], hasil: [], sekolah: 'SMA Negeri Contoh Nusantara' };
  const sess = {};
  let seq = 1000;
  const nid = function (p) { return p + (++seq); };
  const fail = function (msg, code) { throw { msg: msg, code: code || 'ERR' }; };
  const shuf = function (a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const LET = ['A', 'B', 'C', 'D', 'E'];
  function img(label, color) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="170"><rect width="320" height="170" fill="' + color + '"/><text x="160" y="96" font-size="24" text-anchor="middle" fill="#fff" font-family="Arial">' + label + '</text></svg>';
    return '<img src="data:image/svg+xml;base64,' + btoa(svg) + '" alt="gambar" />';
  }
  function mkQ(idUjian, nomor, teks, ops, kunci) {
    const o = { A: '', B: '', C: '', D: '', E: '' };
    ops.forEach(function (t, i) { o[LET[i]] = t; });
    D.soal.push({ id: nid('Q'), idUjian: idUjian, nomor: nomor, teks: teks, opsi: o, kunci: kunci });
  }
  function seed() {
    D.users.push({ id: 'U1', username: 'admin', password: 'edudigital', nama: 'Proktor Utama', kelas: '', role: 'admin', status: 'aktif' });
    D.users.push({ id: 'U2', username: 'peserta', password: 'edudigital', nama: 'Peserta Contoh', kelas: 'X-A', role: 'siswa', status: 'aktif' });
    [['Andi Pratama', 'X-A'], ['Budi Santoso', 'X-A'], ['Citra Lestari', 'X-B'], ['Dewi Anggraini', 'X-B'], ['Eko Wijaya', 'X-A']].forEach(function (r, i) {
      D.users.push({ id: 'U' + (i + 3), username: r[0].split(' ')[0].toLowerCase(), password: 'abc' + (100 + i), nama: r[0], kelas: r[1], role: 'siswa', status: 'aktif' });
    });
    D.ujian.push({ id: 'E1', judul: 'Matematika - Aljabar Dasar', mapel: 'Matematika', kelas: 'Semua', durasi: 30, mulai: now - 3600000, selesai: now + 30 * DAY, token: '', jumlahOpsi: 4, acakSoal: 'ya', acakOpsi: 'tidak', tampilHasil: 'ya', status: 'aktif' });
    D.ujian.push({ id: 'E2', judul: 'Bahasa Indonesia - Teks Eksposisi', mapel: 'Bahasa Indonesia', kelas: 'X-A', durasi: 20, mulai: now - 3600000, selesai: now + 30 * DAY, token: 'CBT123', jumlahOpsi: 5, acakSoal: 'ya', acakOpsi: 'ya', tampilHasil: 'tidak', status: 'aktif' });
    mkQ('E1', 1, '<p>Hasil dari 2x + 3x adalah ...</p>', ['5x', '6x', '5x<sup>2</sup>', '6x<sup>2</sup>'], 'A');
    mkQ('E1', 2, '<p>Jika x + 7 = 12, maka nilai x adalah ...</p>', ['3', '4', '5', '6'], 'C');
    mkQ('E1', 3, '<p>Perhatikan gambar berikut, lalu pilih pernyataan yang benar.</p>' + img('Grafik y = 2x', '#2563eb'), ['Garis naik ke kanan', 'Garis turun ke kanan', 'Garis mendatar', 'Garis tegak lurus sumbu x'], 'A');
    mkQ('E1', 4, '<p>Bentuk sederhana dari 3(x + 2) adalah ...</p>', ['3x + 2', '3x + 5', '3x + 6', 'x + 6'], 'C');
    mkQ('E1', 5, '<p>Nilai dari 5<sup>2</sup> - 3 &times; 4 adalah ...</p>', ['13', '37', '88', '8'], 'A');
    mkQ('E2', 1, '<p>Teks eksposisi bertujuan untuk ...</p>', ['Menghibur pembaca', 'Menjelaskan informasi', 'Mengajak melakukan sesuatu', 'Menceritakan pengalaman', 'Menggambarkan suasana'], 'B');
    mkQ('E2', 2, '<p>Bagian awal teks eksposisi yang berisi pengenalan topik disebut ...</p>', ['Tesis', 'Argumentasi', 'Penegasan ulang', 'Orientasi', 'Resolusi'], 'A');
    mkQ('E2', 3, '<p>Pilih gambar yang paling sesuai dengan kata "alam".</p>', [img('Hutan', '#16a34a'), img('Gedung', '#475569'), img('Mobil', '#dc2626'), img('Pasar', '#d97706'), img('Pabrik', '#7c3aed')], 'A');
  }
  seed();
  const kelasOK = function (uk, k) {
    uk = String(uk || '').trim().toLowerCase();
    if (!uk || uk === 'semua' || uk === 'all') return true;
    return uk.split(',').some(function (x) { return x.trim() === String(k || '').toLowerCase(); });
  };
  const genPw = function () { const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
  function mkUsername(nama) {
    let base = String(nama).toLowerCase().replace(/[^a-z0-9 ]/g, '').trim().split(/\s+/)[0] || 'siswa';
    base = base.slice(0, 10);
    let u = base, n = 1;
    while (D.users.some(function (x) { return x.username.toLowerCase() === u; })) { n++; u = base + n; }
    return u;
  }
  function kelasListSiswa(uj) { return D.users.filter(function (x) { return x.role === 'siswa' && x.status === 'aktif' && kelasOK(uj.kelas, x.kelas); }); }
  function finalize(s) {
    if (s.status === 'selesai') return;
    let b = 0, sl = 0, k = 0;
    s.urutan.forEach(function (id) {
      const q = D.soal.find(function (x) { return x.id === id; });
      const a = s.jawaban[id];
      if (!a || !a.j) k++; else if (q && a.j === q.kunci) b++; else sl++;
    });
    const tot = s.urutan.length || 1;
    s.status = 'selesai';
    s.selesai = Math.min(Date.now(), s.deadline);
    const u = D.users.find(function (x) { return x.username === s.username; }) || {};
    D.hasil = D.hasil.filter(function (h) { return h.sesiId !== s.id; });
    D.hasil.push({ sesiId: s.id, idUjian: s.idUjian, username: s.username, nama: u.nama || s.username, kelas: u.kelas || '', benar: b, salah: sl, kosong: k, nilai: Math.round(b / tot * 10000) / 100, selesai: s.selesai });
  }
  function sesiOf(idUjian, username) { return D.sesi.find(function (y) { return y.idUjian === idUjian && y.username === username; }); }
  function jumlahSoal(id) { return D.soal.filter(function (q) { return q.idUjian === id; }).length; }
  function payload(s, uj) {
    return {
      sesiId: s.id, deadline: s.deadline, serverNow: Date.now(),
      ujian: { judul: uj.judul, durasi: uj.durasi, jumlahOpsi: uj.jumlahOpsi },
      soal: s.urutan.map(function (id) {
        const q = D.soal.find(function (x) { return x.id === id; });
        return { id: q.id, nomor: q.nomor, teks: q.teks, opsi: (s.urutanOpsi[id] || []).map(function (L) { return { key: L, teks: q.opsi[L] }; }) };
      }),
      jawaban: s.jawaban
    };
  }
  function needAdmin(u) { if (u.role !== 'admin') fail('Akses ditolak.', 'FORBID'); }

  const H = {

  /* ---------- API ---------- */
  async function api(action, data, opt) {
    opt = opt || {};
    if (!opt.silent) loading(true);
    try {
      let res;
      if (IS_PREVIEW) {
        await sleep(100);
        res = MOCK.handle(action, data || {}, S.token);
      } else {
        let r;
        try {
          r = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: action, token: S.token, data: data || {} }), redirect: 'follow' });
        } catch (e) { const er = new Error('Koneksi gagal. Periksa internet atau GAS_URL Anda.'); er.code = 'NET'; throw er; }
        try { res = await r.json(); } catch (e) { const er = new Error('Respons server tidak valid. Pastikan Web App GAS di-deploy dengan akses "Anyone".'); er.code = 'NET'; throw er; }
      }
      if (!res.ok) { const er = new Error(res.msg || 'Terjadi kesalahan.'); er.code = res.code; throw er; }
      return res.data;
    } catch (e) {
      if (e.code === 'AUTH' && S.user) doLogout(true);
      throw e;
    } finally { if (!opt.silent) loading(false); }
  }

  /* ---------- gambar: perkecil + unggah ---------- */
  function shrink(uri) {
    return new Promise(function (res) {
      if (/^data:image\/svg/.test(uri)) return res(uri);
      const im = new Image();
      im.onload = function () {
        const MAX = 1000; let w = im.naturalWidth, h = im.naturalHeight;
        if (w <= MAX && uri.length < 400000) return res(uri);
        const k = Math.min(1, MAX / w); w = Math.round(w * k); h = Math.round(h * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      im.onerror = function () { res(uri); };
      im.src = uri;
    });
  }
  async function uploadUri(uri) {
    const sm = await shrink(uri);
    const mime = sm.slice(5, sm.indexOf(';')), b64 = sm.slice(sm.indexOf(',') + 1);
    const r = await api('soal_upload', { name: 'soal_' + Date.now(), mime: mime, base64: b64 }, { silent: true });
    return r.url;
  }
  async function upImgs(html) {
    const re = /src="(data:image\/[a-zA-Z0-9.+-]+;base64,[^"]+)"/g; const found = []; let m;
    while ((m = re.exec(html))) found.push(m[1]);
    let out = html;
    for (const uri of new Set(found)) {
      if (!IMGCACHE[uri]) IMGCACHE[uri] = await uploadUri(uri);
      out = out.split(uri).join(IMGCACHE[uri]);
    }
    return out;
  }

  async function parseDocx(file) {
    if (!window.mammoth) throw new Error('Library pembaca Word belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
    const buf = await file.arrayBuffer();
    const r = await mammoth.convertToHtml({ arrayBuffer: buf }, { convertImage: mammoth.images.imgElement(function (img) { return img.read('base64').then(function (b) { return { src: 'data:' + img.contentType + ';base64,' + b }; }); }) });
    const doc = new DOMParser().parseFromString('<body>' + r.value + '</body>', 'text/html');
    const lines = [];
    function pushLine(h) {
      h.split(/<br\s*\/?>/i).forEach(function (part) {
        const t = part.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
        if (t || /<img/i.test(part)) lines.push(part);
      });
    }
    (function walk(n) {
      Array.prototype.slice.call(n.childNodes).forEach(function (c) {
        if (c.nodeType !== 1) return;
        const t = c.tagName;
        if (t === 'P' || /^H[1-6]$/.test(t)) pushLine(c.innerHTML);
        else if (t === 'LI') {
          const cl = c.cloneNode(true);
          Array.prototype.forEach.call(cl.querySelectorAll('ol,ul'), function (x) { x.remove(); });
          pushLine(cl.innerHTML);
          Array.prototype.forEach.call(c.children, function (x) { if (x.tagName === 'OL' || x.tagName === 'UL') walk(x); });
        } else walk(c);
      });
    })(doc.body);
    const RQ = /^((?:\s|<[^>]+>)*?)(\d{1,3})\s*[.)](?:<\/[a-z]+>)*\s+/i;
    const RO = /^((?:\s|<[^>]+>)*?)([A-Ea-e])\s*[.)](?:<\/[a-z]+>)*(?:\s+|(?=<)|$)/;
    const RK = /^\s*(?:kunci(?:\s*jawaban)?|jawaban|key|answer)\s*[:=\-]\s*([A-Ea-e])\b/i;
    const qs = []; let cur = null, lastOpt = null;
    lines.forEach(function (h) {
      const text = h.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
      let m = RK.exec(text);
      if (m) { if (cur) cur.kunci = m[1].toUpperCase(); return; }
      m = RQ.exec(h);
      if (m) { cur = { teks: h.slice(m[0].length), opsi: {}, kunci: '' }; qs.push(cur); lastOpt = null; return; }
      m = RO.exec(h);
      if (m && cur) { lastOpt = m[2].toUpperCase(); cur.opsi[lastOpt] = h.slice(m[0].length); return; }
      if (!cur) return;
      if (lastOpt) cur.opsi[lastOpt] += '<br>' + h; else cur.teks += '<br>' + h;
    });
    qs.forEach(function (q) { q.teks = q.teks.replace(/^(<br>)+/, ''); });
    return qs;
  }

    $('#main').innerHTML = ph(adm ? 'Pengaturan' : 'Ganti Password') +
      (adm ? '<div class="card" style="max-width:520px"><b>Identitas Sekolah</b><div class="fg" style="margin-top:10px"><label>Nama sekolah / judul aplikasi</label><input id="s-nama" value="' + esc(S.sekolah) + '"></div><button class="btn pri" onclick="A.saveSet()">Simpan</button></div>' : '') +
      '<div class="card" style="max-width:520px"><b>Ganti Password</b><div class="fg" style="margin-top:10px"><label>Password lama</label><input id="p-old" type="password"></div><div class="fg"><label>Password baru</label><input id="p-new" type="password"></div><div class="fg"><label>Ulangi password baru</label><input id="p-new2" type="password"></div><button class="btn pri" onclick="A.savePw()">Ubah Password</button></div>';
  };
  A.saveSet = async function () {
    const r = await run(function () { return api('settings_save', { sekolah: $('#s-nama').value }); });
    if (r) { S.sekolah = r.sekolah; applyBrand(); toast('Pengaturan disimpan.', 'ok'); }
  };
  A.savePw = async function () {
    if ($('#p-new').value !== $('#p-new2').value) { toast('Konfirmasi password tidak sama.', 'err'); return; }
    const ok = await run(function () { return api('changePw', { oldPw: $('#p-old').value, newPw: $('#p-new').value }); });
    if (ok) { toast('Password berhasil diubah.', 'ok'); $('#p-old').value = $('#p-new').value = $('#p-new2').value = ''; }
  };

  /* ================= SISWA: DAFTAR UJIAN ================= */
  V.exams = async function () {
    const list = await api('siswa_exams');
    $('#main').innerHTML = ph('Daftar Ujian') + (list.length ? '<div class="grid2">' + list.map(function (u) {
      let act = '', bd = '';
      if (u.state === 'buka') { bd = badge('Dibuka', 'ok'); act = '<button class="btn pri" onclick="A.startExam(\'' + u.id + '\',' + (u.perluToken ? 1 : 0) + ',0)">Mulai Ujian</button>'; }
      else if (u.state === 'berlangsung') { bd = badge('Sedang berlangsung', 'info'); act = '<button class="btn ok" onclick="A.startExam(\'' + u.id + '\',0,1)">Lanjutkan Ujian</button>'; }
      else if (u.state === 'belum') { bd = badge('Belum dibuka', 'warn'); act = '<button class="btn" disabled>Dibuka ' + fmtDate(u.mulai) + '</button>'; }
      else if (u.state === 'tutup') { bd = badge('Ditutup', 'err'); act = '<button class="btn" disabled>Ujian ditutup</button>'; }
      else { bd = badge('Selesai', 'ok'); act = '<button class="btn" disabled>' + (u.nilai !== undefined ? 'Nilai: ' + u.nilai : 'Sudah dikerjakan') + '</button>'; }
      return '<div class="ex-card"><div>' + bd + '</div><h3>' + esc(u.judul) + '</h3><div class="meta">' + esc(u.mapel) + ' • ' + u.jumlahSoal + ' soal • ' + u.durasi + ' menit' + (u.perluToken ? ' • perlu token' : '') + '</div><div class="meta">Buka: ' + fmtDate(u.mulai) + '<br>Tutup: ' + fmtDate(u.selesai) + '</div>' + act + '</div>';
    }).join('') + '</div>' : '<div class="card mut">Belum ada ujian untuk kelas Anda.</div>');
  };
  V.myres = async function () {
    const list = await api('siswa_results');
    $('#main').innerHTML = ph('Hasil Saya') + '<div class="card"><div class="tw"><table><thead><tr><th>Ujian</th><th>Mapel</th><th>Selesai</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Kosong</th></tr></thead><tbody>' +
      (list.length ? list.map(function (x) { return '<tr><td>' + esc(x.judul) + '</td><td>' + esc(x.mapel) + '</td><td>' + fmtDate(x.selesai) + '</td>' + (x.tampil ? '<td><b>' + x.nilai + '</b></td><td>' + x.benar + '</td><td>' + x.salah + '</td><td>' + x.kosong + '</td>' : '<td colspan="4" class="mut">Nilai belum ditampilkan oleh proktor</td>') + '</tr>'; }).join('') : '<tr><td colspan="7" class="mut">Belum ada ujian yang diselesaikan.</td></tr>') + '</tbody></table></div></div>';
  };

  /* ================= SISWA: PELAKSANAAN UJIAN ================= */
  A.startExam = async function (id, needToken, resume) {
    if (resume) return beginExam(id, '');
    if (needToken) {
      modal('Masukkan Token Ujian', '<div class="fg"><label>Token</label><input id="tk" style="text-transform:uppercase;font-size:20px;letter-spacing:3px;text-align:center" autocomplete="off"></div><p class="mut">Token diberikan oleh proktor/pengawas.</p>',
        { foot: '<button class="btn" onclick="A.closeModal()">Batal</button><button class="btn pri" onclick="A.tokenGo(\'' + id + '\')">Mulai</button>' });
      setTimeout(function () { const t = $('#tk'); if (t) t.focus(); }, 80);
      return;
    }
    if (await ask('Mulai ujian sekarang? Waktu akan langsung berjalan dan tidak bisa dihentikan.', 'Mulai')) beginExam(id, '');
  };
  A.tokenGo = function (id) { const t = $('#tk').value.trim(); if (!t) { toast('Token wajib diisi.', 'err'); return; } A.closeModal(); beginExam(id, t); };
  async function beginExam(id, token) {
    const d = await run(function () { return api('siswa_start', { idUjian: id, token: token }); });
    if (!d) return;
    E = { sesiId: d.sesiId, soal: d.soal, idx: 0, jawaban: d.jawaban || {}, deadline: d.deadline, offset: d.serverNow - Date.now(), pending: {}, judul: d.ujian.judul, done: false, flushing: false, retry: null, finishing: false };
    $('#cbt-app').hidden = true; $('#cbt-exam').hidden = false;
    $('#cbt-exam').innerHTML = '<div class="ex-head"><b>' + esc(d.ujian.judul) + '</b><span class="ex-save" id="ex-save"></span><span class="ex-timer" id="ex-timer">--:--</span><button class="btn ok" onclick="A.finishAsk()">Selesai</button></div><div class="ex-body"><div class="card" id="ex-q"></div><div class="card"><b>Navigasi Soal</b><div class="nav-grid" id="ex-nav" style="margin-top:10px"></div><div class="legend"><span>🟩 terjawab</span><span>🟧 ragu-ragu</span><span>⬜ belum</span></div></div></div>';
    exQ(); exNav(); tick();
    clearInterval(TIMER); TIMER = setInterval(tick, 1000);
  }
  function remaining() { return (E.deadline - (Date.now() + E.offset)) / 1000; }
  function tick() {
    if (!E || E.done) return;
    const r = remaining(); const t = $('#ex-timer'); if (!t) return;
    t.textContent = fmtClock(r); t.classList.toggle('low', r <= 300);
    if (r <= 0 && !E.finishing) finishExam(true);
  }
  function exQ() {
    const q = E.soal[E.idx], a = E.jawaban[q.id] || {};
    $('#ex-q').innerHTML = '<div class="qno">Soal ' + (E.idx + 1) + ' dari ' + E.soal.length + '</div><div class="qtext rich">' + san(q.teks) + '</div>' +
      q.opsi.map(function (o, i) { return '<button class="opt' + (a.j === o.key ? ' sel' : '') + '" onclick="A.pick(\'' + q.id + '\',\'' + o.key + '\')"><span class="ol">' + LET[i] + '</span><span class="rich">' + san(o.teks) + '</span></button>'; }).join('') +
      '<div class="ex-act"><button class="btn" ' + (E.idx === 0 ? 'disabled' : '') + ' onclick="A.nav(' + (E.idx - 1) + ')">◀ Sebelumnya</button><button class="btn ' + (a.r ? 'danger' : '') + '" onclick="A.ragu(\'' + q.id + '\')">' + (a.r ? '✔ Ragu-ragu' : 'Ragu-ragu') + '</button>' + (a.j ? '<button class="btn" onclick="A.clearAns(\'' + q.id + '\')">Hapus jawaban</button>' : '') + (E.idx < E.soal.length - 1 ? '<button class="btn pri" onclick="A.nav(' + (E.idx + 1) + ')">Berikutnya ▶</button>' : '<button class="btn ok" onclick="A.finishAsk()">Selesai ✔</button>') + '</div>';
    const b = $('.ex-body'); if (b) b.scrollTop = 0;
  }
  function exNav() {
    $('#ex-nav').innerHTML = E.soal.map(function (q, i) {
      const a = E.jawaban[q.id] || {};
      return '<button class="nb' + (a.r ? ' r' : a.j ? ' a' : '') + (i === E.idx ? ' c' : '') + '" onclick="A.nav(' + i + ')">' + (i + 1) + '</button>';
    }).join('');
  }
  A.nav = function (i) { if (!E || i < 0 || i >= E.soal.length) return; E.idx = i; exQ(); exNav(); };
  function setAns(id, patch) {
    const a = E.jawaban[id] || { j: '', r: 0 };
    E.jawaban[id] = { j: patch.j !== undefined ? patch.j : a.j, r: patch.r !== undefined ? patch.r : a.r };
    E.pending[id] = { j: E.jawaban[id].j, r: E.jawaban[id].r ? 1 : 0 };
    exQ(); exNav(); flushSave();
  }
  A.pick = function (id, key) { const a = E.jawaban[id] || {}; setAns(id, { j: a.j === key ? '' : key }); };
  A.clearAns = function (id) { setAns(id, { j: '' }); };
  A.ragu = function (id) { const a = E.jawaban[id] || {}; setAns(id, { r: a.r ? 0 : 1 }); };
  const saveState = function (t) { const e = $('#ex-save'); if (e) e.textContent = t; };
  async function flushSave() {
    if (!E || E.flushing) return;
    E.flushing = true; saveState('Menyimpan…');
    try {
      while (E && Object.keys(E.pending).length) {
        const id = Object.keys(E.pending)[0], v = E.pending[id];
        await api('siswa_save', { sesiId: E.sesiId, soalId: id, j: v.j, r: v.r }, { silent: true });
        if (E && E.pending[id] === v) delete E.pending[id];
      }
      saveState('Tersimpan ✓');
    } catch (e) {
      if (!E) return;
      if (e.code === 'TIME') { E.pending = {}; if (!E.finishing) finishExam(true); return; }
      saveState('Gagal menyimpan, mencoba lagi…');
      clearTimeout(E.retry); E.retry = setTimeout(flushSave, 4000);
    } finally { if (E) E.flushing = false; }
  }
  async function drain() {
    for (let i = 0; i < 6 && E && Object.keys(E.pending).length; i++) { await flushSave(); while (E && E.flushing) await sleep(100); if (E && Object.keys(E.pending).length) await sleep(800); }
  }
  A.finishAsk = async function () {
    if (!E || E.finishing) return;
    const total = E.soal.length;
    const done = E.soal.filter(function (q) { return (E.jawaban[q.id] || {}).j; }).length;
    const ragu = E.soal.filter(function (q) { return (E.jawaban[q.id] || {}).r; }).length;
    const msg = 'Terjawab <b>' + done + '</b> dari <b>' + total + '</b> soal.' + (done < total ? '<br><span style="color:#b91c1c">' + (total - done) + ' soal belum dijawab.</span>' : '') + (ragu ? '<br>' + ragu + ' soal masih ditandai ragu-ragu.' : '') + '<br><br>Yakin ingin menyelesaikan ujian? Jawaban tidak dapat diubah lagi.';
    if (await ask(msg, 'Ya, Selesai')) finishExam(false);
  };
  async function finishExam(timeUp) {
    if (!E || E.finishing) return;
    E.finishing = true; clearInterval(TIMER);
    loading(true);
    try {
      await drain();
      let r = null, lastErr = null;
      for (let i = 0; i < 3 && !r; i++) { try { r = await api('siswa_finish', { sesiId: E.sesiId }, { silent: true }); } catch (e) { lastErr = e; await sleep(1200); } }
      if (!r) throw lastErr || new Error('Gagal menyelesaikan ujian.');
      E.done = true; clearTimeout(E.retry);
      $('#cbt-exam').innerHTML = '<div class="res-box card"><div style="font-size:44px">' + (timeUp ? '⏰' : '✅') + '</div><h2 style="margin:6px 0">' + (timeUp ? 'Waktu Habis' : 'Ujian Selesai') + '</h2><p class="mut">Jawaban Anda telah tersimpan.</p>' + (r.tampil ? '<div class="big">' + r.nilai + '</div><p>Benar ' + r.benar + ' • Salah ' + r.salah + ' • Kosong ' + r.kosong + '</p>' : '<p style="margin:14px 0"><b>Nilai akan diumumkan oleh proktor.</b></p>') + '<button class="btn pri" style="margin-top:14px" onclick="A.exitExam()">Kembali ke Daftar Ujian</button></div>';
    } catch (e) {
      E.finishing = false; TIMER = setInterval(tick, 1000);
      toast((e && e.message) || 'Gagal menyelesaikan ujian. Coba lagi.', 'err');
    } finally { loading(false); }
  }
  A.exitExam = function () { E = null; $('#cbt-exam').hidden = true; $('#cbt-exam').innerHTML = ''; $('#cbt-app').hidden = false; A.go('exams'); };
  window.addEventListener('beforeunload', function (ev) { if (E && !E.done) { ev.preventDefault(); ev.returnValue = ''; } });

  /* ================= INIT ================= */
  $('#lg-btn').onclick = A.login;
  $('#lg-p').addEventListener('keydown', function (e) { if (e.key === 'Enter') A.login(); });
  $('#lg-u').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#lg-p').focus(); });
  $('#tb-out').onclick = A.logout;
  $('#hb').onclick = function () { $('#cbt-sb').classList.toggle('open'); };
  $('#main').addEventListener('click', function () { $('#cbt-sb').classList.remove('open'); });
  $('#lg-prev').hidden = !IS_PREVIEW;
  if (!IS_PREVIEW && GAS_URL.indexOf('URL_DEPLOY') >= 0) { toast('GAS_URL belum diisi. Isi URL Web App di bagian konfigurasi.', 'err'); }
  let restored = false;
  try {
    const raw = !IS_PREVIEW && sessionStorage.getItem('cbt_s');
    if (raw) { const o = JSON.parse(raw); S.token = o.t; S.user = o.u; S.sekolah = o.s || S.sekolah; restored = true; }
  } catch (e) { /* abaikan */ }
  applyBrand();
  if (restored) showApp();
  api('publicInfo', {}, { silent: true }).then(function (r) { if (r && r.sekolah) { S.sekolah = r.sekolah; applyBrand(); } }).catch(function () { /* abaikan */ });
})();
</script>
